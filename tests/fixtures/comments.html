<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Local comment fixture</title></head>
<body>
<label>Search <input id="search" placeholder="Search"></label>
<label>Комментарий <textarea id="comment" placeholder="Add comment"></textarea></label>
<button id="publish" onclick="window.posts=(window.posts||0)+1">Post</button>
<button id="like" onclick="window.likes=(window.likes||0)+1">Like</button>
<script>window.posts=0; window.likes=0;</script>
</body></html>
