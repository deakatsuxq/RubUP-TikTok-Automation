<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Local editable fixture</title></head>
<body>
<div data-e2e="comment-input"><div id="comment" role="textbox" contenteditable="true"></div></div>
<button id="publish" onclick="window.posts=(window.posts||0)+1">Post</button>
<button id="like" onclick="window.likes=(window.likes||0)+1">Like</button>
<script>window.posts=0; window.likes=0;</script>
</body></html>
